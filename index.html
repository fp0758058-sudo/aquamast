/* AQUAMAST NEON TERMINAL UPGRADE */

body {
  background:
    radial-gradient(ellipse at 15% 10%, rgba(0,140,255,.20), transparent 35%),
    radial-gradient(ellipse at 85% 30%, rgba(0,230,255,.13), transparent 32%),
    radial-gradient(ellipse at 50% 85%, rgba(20,70,255,.12), transparent 40%),
    #030914;
  background-attachment: fixed;
}

body::before {
  content:"";
  position:fixed;
  inset:-30%;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(circle at 25% 35%,rgba(0,145,255,.13),transparent 25%),
    radial-gradient(circle at 75% 65%,rgba(0,230,255,.10),transparent 25%);
  filter:blur(55px);
  animation: neonDrift 13s ease-in-out infinite alternate;
}

@keyframes neonDrift {
  from { transform:translate(-3%,-2%) scale(.95); }
  to { transform:translate(3%,2%) scale(1.08); }
}

.mark {
  box-shadow:
    0 0 12px #168cff,
    0 0 30px #168cff88,
    0 0 65px #168cff55;
  animation: logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse {
  50% { box-shadow:0 0 20px #42d9ff,0 0 48px #168cffaa; }
}

h1 span {
  text-shadow:0 0 22px #168cff88,0 0 55px #168cff44;
}

.eyebrow,.tag {
  box-shadow:0 0 16px #42d9ff18,inset 0 0 14px #42d9ff0c;
}

.metric,.card,.panel,.market-dashboard,
.calculator,.chart-panel {
  background:linear-gradient(145deg,rgba(16,36,58,.88),rgba(5,16,31,.94));
  border-color:rgba(48,177,255,.22);
  box-shadow:
    0 0 22px rgba(0,119,255,.07),
    inset 0 0 22px rgba(0,170,255,.035);
  backdrop-filter:blur(14px);
  transition:border-color .3s,box-shadow .3s,transform .3s;
}

.metric:hover,.card:hover,.panel:hover {
  border-color:#42d9ff88;
  box-shadow:
    0 0 18px #168cff35,
    0 0 42px #168cff18,
    inset 0 0 20px #42d9ff0b;
}

.btn.primary,.pill {
  background:linear-gradient(110deg,#0878ff,#00cfff);
  box-shadow:0 0 15px #168cff66,0 0 35px #168cff33;
  transition:.25s;
}

.btn.primary:hover,.pill:hover {
  box-shadow:0 0 22px #42d9ffbb,0 0 55px #168cff66;
  filter:brightness(1.15);
}

.secondary {
  box-shadow:inset 0 0 15px #168cff12;
}

.calc-result {
  border-color:#168cff66;
  box-shadow:inset 0 0 25px #168cff16,0 0 20px #168cff18;
}

.calc-result strong {
  color:#52ddff;
  text-shadow:0 0 18px #168cff88;
}

.calc-directions button.active,
.period.active {
  box-shadow:0 0 15px #168cff55,inset 0 0 14px #42d9ff18;
}

.market-table tbody tr.selected {
  box-shadow:inset 3px 0 #42d9ff,inset 0 0 22px #168cff18;
}

.market-table tbody tr:hover {
  background:linear-gradient(90deg,#168cff22,#42d9ff08);
}

.positive {
  text-shadow:0 0 12px #20c99766;
}

.negative {
  text-shadow:0 0 12px #ff687866;
}

.chart-panel {
  border-color:#168cff55;
  box-shadow:0 0 25px #168cff16,inset 0 0 25px #168cff0c;
}

.contactbox {
  box-shadow:0 0 45px #168cff18,inset 0 0 45px #168cff12;
  border-color:#42d9ff55;
}

.contactbox h2 {
  text-shadow:0 0 22px #168cff66;
}

::selection {
  background:#168cff88;
  color:white;
}

input:focus {
  box-shadow:0 0 16px #168cff33;
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
  }
}
/* AQUAMAST — AQUA CORE SIGNATURE */

.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background-image:
    linear-gradient(rgba(66,217,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(66,217,255,.035) 1px,transparent 1px);
  background-size: 42px 42px;
}

.hero .wrap {
  position: relative;
  isolation: isolate;
}

/* Энергетическое ядро */
.hero .wrap::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: clamp(260px, 35vw, 410px);
  aspect-ratio: 1;
  right: 1%;
  top: -35px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 28%, #e0ffff 0 1%, #5fe7ff 5%, transparent 18%),
    radial-gradient(circle at 38% 34%, rgba(0,220,255,.9), rgba(0,115,255,.5) 28%, transparent 70%),
    radial-gradient(circle at 55% 58%, rgba(0,180,255,.3), transparent 65%);
  box-shadow:
    0 0 35px rgba(0,196,255,.55),
    0 0 90px rgba(0,113,255,.35),
    0 0 150px rgba(0,70,255,.2),
    inset -18px -15px 45px rgba(0,8,40,.85);
  animation: aquaFloat 8s ease-in-out infinite,
             aquaPulse 5s ease-in-out infinite;
}

/* Орбитальное кольцо */
.hero .wrap::after {
  content: "";
  position: absolute;
  z-index: -1;
  width: clamp(310px, 43vw, 510px);
  aspect-ratio: 1;
  right: -3%;
  top: -80px;
  border: 1px solid rgba(66,217,255,.55);
  border-radius: 50%;
  transform: rotate(-24deg) scaleY(.36);
  box-shadow:
    0 0 18px rgba(66,217,255,.3),
    inset 0 0 18px rgba(66,217,255,.15);
  animation: aquaOrbit 18s linear infinite;
}

@keyframes aquaFloat {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(13px) scale(1.04); }
}

@keyframes aquaPulse {
  0%,100% { filter: brightness(.9) saturate(1.1); }
  50% { filter: brightness(1.25) saturate(1.6); }
}

@keyframes aquaOrbit {
  to { transform: rotate(336deg) scaleY(.36); }
}

/* Световой проход по карточкам */
.card,.metric,.panel,.calculator,
.market-dashboard,.chart-panel {
  position: relative;
  overflow: hidden;
}

.card::before,.metric::before,.panel::before,
.calculator::before,.market-dashboard::before,
.chart-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(
    115deg,
    transparent 20%,
    rgba(66,217,255,.09) 48%,
    transparent 72%
  );
  transform: translateX(-120%);
  transition: transform .8s ease;
}

.card:hover::before,.metric:hover::before,
.panel:hover::before,.calculator:hover::before,
.market-dashboard:hover::before,
.chart-panel:hover::before {
  transform: translateX(120%);
}

.card:hover,.metric:hover,.panel:hover {
  border-color: rgba(66,217,255,.8);
  box-shadow:
    0 0 22px rgba(0,140,255,.25),
    0 0 55px rgba(0,190,255,.12);
}

.hero h1 span {
  text-shadow:
    0 0 20px rgba(22,140,255,.8),
    0 0 55px rgba(66,217,255,.45);
}

.hero .eyebrow {
  box-shadow:
    0 0 22px rgba(0,210,255,.2),
    inset 0 0 14px rgba(0,210,255,.1);
}

@media(max-width:760px) {
  .hero .wrap::before {
    width: 260px;
    right: -55px;
    top: 5px;
    opacity: .4;
  }
  .hero .wrap::after {
    width: 310px;
    right: -75px;
    top: -5px;
    opacity: .4;
  }
}

@media(prefers-reduced-motion:reduce) {
  .hero .wrap::before,
  .hero .wrap::after {
    animation: none !important;
  }
  .card::before,.metric::before,.panel::before,
  .calculator::before,.market-dashboard::before,
  .chart-panel::before {
    display: none;
  }

<script>
(() => {
const assets=[
{symbol:"BTCUSDT",name:"Bitcoin",code:"BTC"},
{symbol:"ETHUSDT",name:"Ethereum",code:"ETH"},
{symbol:"BNBUSDT",name:"BNB",code:"BNB"},
{symbol:"SOLUSDT",name:"Solana",code:"SOL"},
{symbol:"XRPUSDT",name:"XRP",code:"XRP"},
{symbol:"DOGEUSDT",name:"Dogecoin",code:"DOGE"},
{symbol:"ADAUSDT",name:"Cardano",code:"ADA"},
{symbol:"TRXUSDT",name:"TRON",code:"TRX"}];

const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("ru-RU",{maximumFractionDigits:n<1?6:2});
let selected="BTCUSDT",period="24h",tickers=[],usdRub=null,calcDirection="rub";

async function loadMarket(){
$("marketUpdated").textContent="Обновляем котировки…";
try{
const symbols=encodeURIComponent(JSON.stringify(assets.map(a=>a.symbol)));
  const res=await fetch("https://api.binance.com/api/v3/ticker/24hr?symbols="+symbols);
if(!res.ok)throw Error("API error");
tickers=await res.json();
renderRows();
$("marketUpdated").textContent="Обновлено: "+new Date().toLocaleTimeString("ru-RU")+" · источник: Binance";
loadChart();
}catch(e){
$("marketUpdated").textContent="Не удалось загрузить котировки. Попробуйте позже.";
$("marketRows").innerHTML='<tr><td colspan="3">Рыночные данные временно недоступны.</td></tr>';
$("chartStatus").textContent="График временно недоступен.";
}
}

function renderRows(){
const q=$("coinSearch").value.trim().toLowerCase();
const rows=assets.filter(a=>(a.name+" "+a.code).toLowerCase().includes(q));
$("marketRows").innerHTML=rows.map(a=>{
const t=tickers.find(x=>x.symbol===a.symbol);
if(!t)return "";
const change=Number(t.priceChangePercent);
return '<tr data-symbol="'+a.symbol+'" class="'+(selected===a.symbol?"selected":"")+'"><td><span class="coin-name">'+a.name+'</span><span class="coin-symbol">'+a.code+'</span></td><td>'+fmt(t.lastPrice)+'</td><td class="'+(change>=0?"positive":"negative")+'">'+(change>0?"+":"")+change.toFixed(2)+'%</td></tr>';
}).join("")||'<tr><td colspan="3">Ничего не найдено.</td></tr>';
document.querySelectorAll("#marketRows tr[data-symbol]").forEach(row=>row.addEventListener("click",()=>{
selected=row.dataset.symbol;renderRows();loadChart();
}));
}

async function loadChart(){
const a=assets.find(x=>x.symbol===selected),t=tickers.find(x=>x.symbol===selected);
$("chartCoinName").textContent=a.code+" / USDT";
$("chartPrice").textContent=t?"Цена: "+fmt(t.lastPrice)+" USDT":"";
$("chartStatus").textContent="Загружаем историю цены…";
const cfg=period==="24h"?{interval:"15m",limit:96}:period==="7d"?{interval:"1h",limit:168}:{interval:"4h",limit:180};
try{
const res=await fetch("https://api.binance.com/api/v3/klines?symbol="+selected+"&interval="+cfg.interval+"&limit="+cfg.limit);
if(!res.ok)throw Error("API error");
const candles=await res.json();
drawChart(candles.map(c=>Number(c[4])));
$("chartStatus").textContent="Исторические значения · период "+period.toUpperCase()+" · источник: Binance";
}catch(e){$("chartStatus").textContent="История цены временно недоступна.";}
}

function drawChart(values){
if(!values.length)return;
const canvas=$("priceChart"),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
canvas.width=Math.max(1,Math.floor(rect.width*dpr));
canvas.height=Math.max(1,Math.floor(rect.height*dpr));
const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
const w=rect.width,h=rect.height,pad=12,min=Math.min(...values),max=Math.max(...values),range=max-min||1;
ctx.clearRect(0,0,w,h);
ctx.strokeStyle="rgba(145,190,230,.13)";
for(let i=0;i<4;i++){const y=pad+(h-pad*2)*i/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
const pts=values.map((v,i)=>({x:pad+(w-pad*2)*i/Math.max(1,values.length-1),y:h-pad-(v-min)/range*(h-pad*2)}));
const grad=ctx.createLinearGradient(0,pad,0,h-pad);
grad.addColorStop(0,"rgba(22,140,255,.28)");grad.addColorStop(1,"rgba(22,140,255,0)");
ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
ctx.lineTo(pts[pts.length-1].x,h-pad);ctx.lineTo(pts[0].x,h-pad);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
ctx.strokeStyle="#42d9ff";ctx.lineWidth=2;ctx.stroke();
}

async function loadRubRate(){
$("rateStatus").textContent="Получаем справочный курс USD/RUB…";
try{
const res=await fetch("https://open.er-api.com/v6/latest/USD");
if(!res.ok)throw Error("Rate API error");
const data=await res.json();
if(data.result!=="success"||!data.rates.RUB)throw Error("No RUB rate");
usdRub=Number(data.rates.RUB);
$("rateStatus").textContent="Справочный USD/RUB: "+fmt(usdRub)+" · обновлено "+new Date(data.time_last_update_utc).toLocaleString("ru-RU");
updateCalculator();
}catch(e){
$("rateStatus").textContent="Не удалось получить справочный курс. Попробуйте позже.";
$("calcRate").textContent="Курс временно недоступен.";
}
}

function updateCalculator(){
const amount=Math.max(0,Number($("calcAmount").value)||0);
if(!usdRub){$("calcResult").textContent="Нет данных";return;}
if(calcDirection==="rub"){
$("amountLabel").textContent="Сумма в RUB";
$("calcResult").textContent=fmt(amount/usdRub)+" USDT";
$("calcRate").textContent="Ориентир: 1 USDT ≈ "+fmt(usdRub)+" RUB";
}else{
$("amountLabel").textContent="Сумма в USDT";
$("calcResult").textContent=fmt(amount*usdRub)+" RUB";
$("calcRate").textContent="Ориентир: 1 USDT ≈ "+fmt(usdRub)+" RUB";
}
}

function setDirection(direction){
calcDirection=direction;
$("rubToUsdt").classList.toggle("active",direction==="rub");
$("usdtToRub").classList.toggle("active",direction==="usdt");
$("calcAmount").value="";
$("calcAmount").placeholder=direction==="rub"?"Введите сумму в RUB":"Введите сумму в USDT";
updateCalculator();
}

$("coinSearch").addEventListener("input",renderRows);
$("refreshMarket").addEventListener("click",loadMarket);
$("calcAmount").addEventListener("input",updateCalculator);
$("rubToUsdt").addEventListener("click",()=>setDirection("rub"));
$("usdtToRub").addEventListener("click",()=>setDirection("usdt"));
document.querySelectorAll(".period").forEach(btn=>btn.addEventListener("click",()=>{
period=btn.dataset.period;
document.querySelectorAll(".period").forEach(b=>b.classList.toggle("active",b===btn));
loadChart();
}));
window.addEventListener("resize",()=>{if(tickers.length)loadChart();});
loadMarket();
loadRubRate();
setInterval(loadMarket,60000);
setInterval(loadRubRate,900000);
})();
</script>

      <div class="signal-note">
        Информационный мониторинг публичных котировок Binance.
        Сигнал не является прогнозом или торговой рекомендацией.
        Проверка работает, пока открыта эта страница.
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const coin = document.getElementById("aquaCoin");
  const threshold = document.getElementById("aquaThreshold");
  const toggle = document.getElementById("aquaToggle");
  const status = document.getElementById("aquaStatus");

  if (!coin || !threshold || !toggle || !status) return;

  let enabled = false;
  let timer = null;
  let busy = false;

  const symbols = [
    "BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT",
    "XRPUSDT","DOGEUSDT","ADAUSDT","TRXUSDT"
  ];

  async function checkMarket() {
    if (!enabled || busy) return;
    busy = true;

    try {
      const response = await fetch(
        "https://api.binance.com/api/v3/ticker/24hr?symbols=" +
        encodeURIComponent(JSON.stringify(symbols))
      );

      if (!response.ok) throw new Error("API unavailable");

      const data = await response.json();
      const ticker = data.find(item => item.symbol === coin.value);

      if (!ticker) throw new Error("No ticker");

      const change = Number(ticker.priceChangePercent);
      const price = Number(ticker.lastPrice);
      const limit = Number(threshold.value);
      const reached = Math.abs(change) >= limit;

      status.className = "signal-status " +
        (reached ? "triggered" : "active");

      status.textContent =
        (reached ? "AQUA SIGNAL · Порог достигнут. " :
        "Наблюдение активно. ") +
        coin.value.replace("USDT","") +
        ": " + (change > 0 ? "+" : "") +
        change.toFixed(2) +
        "% за 24 часа · Цена: " +
        price.toLocaleString("ru-RU") + " USDT" +
        " · " + new Date().toLocaleTimeString("ru-RU");

      if (reached && "Notification" in window &&
          Notification.permission === "granted") {
        if (!checkMarket.notified) {
          new Notification("AQUA SIGNAL", {
            body: coin.value.replace("USDT","") +
              ": изменение " + change.toFixed(2) + "%"
          });
          checkMarket.notified = true;
        }
      } else {
        checkMarket.notified = false;
      }

    } catch (error) {
      status.className = "signal-status";
      status.textContent =
        "Не удалось получить котировки. Повторная проверка позже.";
    } finally {
      busy = false;
    }
  }

  toggle.addEventListener("click", async () => {
    enabled = !enabled;

    if (enabled) {
      toggle.textContent = "Отключить сигнал";
      status.textContent = "Подключаемся к публичным котировкам…";

      if ("Notification" in window &&
          Notification.permission === "default") {
        try {
          await Notification.requestPermission();
        } catch (e) {}
      }

      checkMarket();
      timer = setInterval(checkMarket, 30000);

    } else {
      clearInterval(timer);
      timer = null;
      toggle.textContent = "Включить сигнал";
      status.className = "signal-status";
      status.textContent = "Наблюдение выключено.";
    }
  });

  coin.addEventListener("change", () => {
    checkMarket.notified = false;
    if (enabled) checkMarket();
  });

  threshold.addEventListener("change", () => {
    checkMarket.notified = false;
    if (enabled) checkMarket();
  });
})();
</script>
<!-- END AQUAMAST AQUA SIGNAL --></body>
</html>
